<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcela's Resort Hotel - SOPs & Staffing</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/pwa/manifest.json">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/main.css">
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/pwa/sw.js')
        .then(reg => console.log('SW registered:', reg));
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  <!-- Emergency Access Button (Always Visible) -->
  <div class="fixed bottom-4 right-4 z-50">
    <a href="/sops/06_safety_typhoon.html" 
       class="flex items-center gap-2 bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-full shadow-lg font-semibold transition-transform hover:scale-105"
       aria-label="Emergency Procedures">
      <i class="fa-solid fa-triangle-exclamation text-xl"></i>
      EMERGENCY ACCESS
    </a>
  </div>

  <!-- Header Navigation -->
  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-40">
    <nav class="container mx-auto px-4 py-3">
      <div class="flex flex-col md:flex-row justify-between items-center gap-4">
        
        <!-- Logo/Title -->
        <a href="/" class="text-xl font-bold hover:text-indigo-200 transition-colors">
          <i class="fa-solid fa-hotel mr-2"></i>
          Marcela's Resort Hotel
        </a>

        <!-- Navigation Tabs -->
        <div class="flex gap-2 flex-wrap justify-center">
          <a href="/" class="px-4 py-2 bg-indigo-800 rounded hover:bg-indigo-600 transition">
            <i class="fa-solid fa-house mr-1"></i>Home
          </a>
          <a href="#sops" class="px-4 py-2 bg-indigo-800 rounded hover:bg-indigo-600 transition">
            <i class="fa-solid fa-book mr-1"></i>SOP Modules
          </a>
          <a href="#staffing" class="px-4 py-2 bg-indigo-800 rounded hover:bg-indigo-600 transition">
            <i class="fa-solid fa-users mr-1"></i>Staffing
          </a>
        </div>

        <!-- Search Bar -->
        <div class="flex items-center gap-2 w-full md:w-auto">
          <input type="search" id="searchInput" 
                 placeholder="Search SOPs..." 
                 class="w-full md:w-64 px-3 py-2 rounded text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                 aria-label="Search SOPs">
          <button id="searchBtn" class="px-3 py-2 bg-indigo-800 rounded hover:bg-indigo-600 transition" aria-label="Search">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>

      </div>
    </nav>
  </header>

  <!-- Main Content Area -->
  <main id="content" class="flex-grow container mx-auto px-4 py-6">
    <!-- Dynamic content injected by app.js -->
  </main>

  <!-- Footer -->
  <footer class="bg-gray-800 text-gray-300 py-6 mt-auto">
    <div class="container mx-auto px-4 text-center">
      <p>&copy; 2026 Marcela's Resort Hotel, Gamay, Northern Samar</p>
      <p class="text-sm mt-1">
        <a href="/sops/06_safety_typhoon.html" class="text-red-400 hover:text-red-300">
          <i class="fa-solid fa-triangle-exclamation mr-1"></i>Emergency Procedures
        </a>
      </p>
      <div class="flex justify-center gap-4 mt-4 text-sm">
        <span><i class="fa-solid fa-wifi mr-1"></i>Starlink Primary</span>
        <span><i class="fa-solid fa-satellite-dish mr-1"></i>4G LTE Backup</span>
      </div>
    </div>
  </footer>

  <!-- JavaScript -->
  <script src="/js/app.js"></script>
  <script src="/js/search.js"></script>
  <script src="/js/offline.js"></script>

</body>
</html>
